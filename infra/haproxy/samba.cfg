# SAMBA additions for lb-01's /etc/haproxy/haproxy.cfg.
#
# Both parts are ADDITIVE. The existing frontend's `default_backend` is not
# changed, so only requests carrying the SAMBA Host header are diverted —
# every other request follows exactly the path it does today.
#
# Replace samba.example.com and the two <..._PRIVATE_IP> placeholders.

# ---------------------------------------------------------------------------
# PART 1 — add these two lines INSIDE the existing frontend that binds *:80.
#
# They go in the existing frontend rather than a new one because two frontends
# cannot bind the same port. Put the `acl` with the other acls and the
# `use_backend` above the existing `default_backend` line; ordering among
# use_backend rules matters, `default_backend` always loses to a matching one.
# ---------------------------------------------------------------------------
#
#     acl host_samba hdr(host) -i samba.example.com
#     use_backend samba-backend if host_samba
#
# ---------------------------------------------------------------------------
# PART 2 — append this backend at the end of the file.
# ---------------------------------------------------------------------------

backend samba-backend
    balance roundrobin

    # The Host header is mandatory: the app servers route this vhost by name,
    # and a check without it would be answered by their default (rwanda-risk-alert)
    # vhost — which would report healthy even with SAMBA completely down.
    #
    # /healthz proxies through the SPA container to the API's /health, so a
    # server is only marked UP when its nginx AND its backend API are alive.
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host samba.example.com
    http-check expect status 200

    # Port 80 = the app servers' host nginx, which name-routes to the SAMBA vhost.
    server web-01 <WEB01_PRIVATE_IP>:80 check inter 5s fall 3 rise 2
    server web-02 <WEB02_PRIVATE_IP>:80 check inter 5s fall 3 rise 2

# On HAProxy older than 2.2 the `http-check send` syntax above does not exist.
# Use this single line in its place:
#
#     option httpchk GET /healthz HTTP/1.1\r\nHost:\ samba.example.com
#
# Check the version with: haproxy -v
