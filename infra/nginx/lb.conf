# Load balancer for the backend API (deployment diagram: the LB fronting the
# 3 web-server/API replicas).
#
# Using a variable in proxy_pass + the Docker embedded DNS resolver forces
# per-request re-resolution of the `api` service name, which round-robins across
# all running replicas (docker compose up --scale api=3).

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }
}
