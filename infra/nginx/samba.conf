# SAMBA vhost for web-01 / web-02 (the HOST nginx, not a container).
#
# Install as /etc/nginx/sites-available/samba, then symlink into sites-enabled.
# Replace samba.example.com with the real hostname before enabling.
#
# ---------------------------------------------------------------------------
# Why this does not disturb the two sites already on these servers
# ---------------------------------------------------------------------------
# * There is deliberately NO `default_server` here. nginx elects the first
#   server block it parses for a given listen address as that address's default.
#   sites-enabled/* is globbed alphabetically and "rwanda-risk-alert" sorts
#   before "samba", so rwanda-risk-alert keeps the :80 catch-all it has today.
#   Any request whose Host is not the SAMBA hostname still lands there,
#   unchanged. Adding `default_server` below would take that over — don't.
# * The :8080 static site is a separate listen address entirely and is untouched.
# * Nothing here binds :8000, which rwanda-risk-alert proxies to.

server {
    listen 80;
    listen [::]:80;
    server_name samba.example.com;

    # Matches the convention already used by the other two sites, and makes it
    # visible which app server served a request through the load balancer.
    add_header X-Served-By $hostname;

    # The SPA container publishes on loopback only, so this nginx is the single
    # way in. The container's own nginx serves the built dashboard and proxies
    # /api/ onward to the backend.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
