server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # End-to-end probe for the load balancer. A plain `GET /` would hit the SPA
    # fallback below and return 200 even with a dead backend, so a replica would
    # stay in rotation while serving a broken app. This proxies to the API's
    # root-level /health instead, so a 200 means nginx *and* the API are alive.
    location = /healthz {
        access_log off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $health http://api:8000/health;
        proxy_pass $health;
    }

    # Proxy API calls to the backend so the SPA uses same-origin URLs.
    #
    # Resolve the `api` hostname per-request via Docker's embedded DNS (127.0.0.11)
    # instead of once at startup. A static `proxy_pass http://api:8000` caches the
    # backend's IP for nginx's lifetime, so rebuilding only the api container (new
    # IP) leaves nginx proxying to a dead address -> 502 until web is restarted.
    # Using a variable defers resolution to request time, so it self-heals.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
