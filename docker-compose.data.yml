# web-01 ONLY — the shared data tier.
#
# PostGIS, Redis and MinIO cannot be duplicated per server: two copies behind a
# round-robin load balancer means users see different data depending on which
# replica they land on. web-01 owns them; web-02 connects over the private network.
#
# These publish on the PRIVATE interface only. Redis ships with no
# authentication at all, and Postgres/MinIO would otherwise be reachable from
# the internet. Set DATA_BIND_IP to web-01's private IP in .env.
#
# The `:?` form is deliberate: an EMPTY DATA_BIND_IP makes compose drop the
# host_ip entirely and bind 0.0.0.0 — silently publishing the whole data tier.
# Failing to start is the correct outcome, so make the variable mandatory.
#
# Find the right value with:  hostname -I | awk '{print $1}'

services:
  postgis:
    ports: !override
      - "${DATA_BIND_IP:?set DATA_BIND_IP to web-01's private IP in .env}:5432:5432"
    restart: unless-stopped

  redis:
    ports: !override
      - "${DATA_BIND_IP:?set DATA_BIND_IP to web-01's private IP in .env}:6379:6379"
    restart: unless-stopped

  minio:
    ports: !override
      - "${DATA_BIND_IP:?set DATA_BIND_IP to web-01's private IP in .env}:9000:9000"
      - "127.0.0.1:9001:9001"         # console — local/tunnel only
    restart: unless-stopped
